# Render Blueprint — creates the whole setup from this repo: Render → New → Blueprint → pick the repo.
# One web service (server + website + admin + the phone app's web version at /app) with a persistent disk.
# Scheduled jobs run inside it every 30 minutes (scripts/start.sh). Region: Singapore (closest to India).
services:
  - type: web
    name: project-connect
    runtime: node
    region: singapore
    plan: starter              # a disk needs a paid instance; one instance only (database + photos live on the disk)
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:server   # migrations → first-boot setup → scheduled jobs → server
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:/var/data/prod.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SEED_ADMIN_EMAIL     # your admin login — Render asks for it when you create the Blueprint
        sync: false
      - key: SEED_ADMIN_PASSWORD  # generated; read it in Render → project-connect → Environment
        generateValue: true
      - key: AUTH_SECRET          # signs sessions; changing it signs everyone out
        generateValue: true
      - key: FIELD_KEY_SECRET     # encrypts messages at rest — never change or delete it, or messages become unreadable
        generateValue: true
      - key: CRON_SECRET          # protects the scheduled-jobs endpoint
        generateValue: true
      - key: PRIVATE_BETA         # asks search engines not to index the site while you're testing
        value: "true"
      # --- Test phase settings: change these before inviting the public (see docs/DEPLOYMENT.md) ---
      - key: BILLING_PROVIDER
        value: mock
      - key: ENABLE_MOCK_PAYMENTS   # "true" = testers can try Premium with simulated payments, no money moves
        value: "true"
      - key: DEV_SHOW_OTP
        value: "false"
      - key: PUSH_ENABLED
        value: "false"
      # --- Fill these in when you go live with payments ---
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Email for password-reset links (resend.com). Until both are set, no reset emails are sent.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # SMS OTP (MSG91, DLT-approved template)
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_OTP_TEMPLATE_ID
        sync: false
      # Database backups. Starts as a folder on the disk (protects against bad changes, not disk loss);
      # switch BACKUP_DRIVER to s3 once cloud storage is set up. Copy BACKUP_KEY somewhere safe offline.
      - key: BACKUP_KEY
        generateValue: true
      - key: BACKUP_DRIVER
        value: dir
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: BACKUP_KEEP_DAYS
        value: "14"
      # Automatic photo checks (Sightengine). Without these, new photos wait in Admin → Photo review.
      - key: SIGHTENGINE_USER
        sync: false
      - key: SIGHTENGINE_SECRET
        sync: false
      # Fictional sample people with matches and chats, for testing (demo logins aanya@demo.local and
      # rohan@demo.local). Set "false" and run `npm run db:remove-samples` before the public launch.
      - key: SEED_SAMPLE_USERS
        value: "true"
      - key: SEED_SAMPLE_COUNT
        value: "120"
      - key: SAMPLE_MATCHES_FOR
        sync: false
      # On-server photo and face checks (nudity scan, selfie face match). They need ~300 MB extra memory,
      # which the Starter plan (512 MB) can't spare: keep "false" until the service runs on Standard (2 GB)
      # or larger, then set "true". While off, photos and selfies are checked by staff by eye.
      - key: PHOTO_SCAN_LOCAL
        value: "false"
      - key: VISION_MEMORY_MB
        value: "384"
      # Voice and video calls: a TURN relay (keeps members' IP addresses private). Calls stay off until set.
      # See docs/CALLS.md. TURN_SECRET for coturn-style short-lived credentials, or TURN_USERNAME/TURN_CREDENTIAL.
      - key: TURN_URLS
        sync: false
      - key: TURN_SECRET
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      # In-app purchases (App Store / Google Play). Off until the store accounts and products exist.
      - key: STORE_BILLING_ENABLED
        value: "false"
      - key: APPLE_BUNDLE_ID
        sync: false
      - key: APPLE_APP_ID
        sync: false
      - key: APPLE_ROOT_CERTS_B64
        sync: false
      - key: GOOGLE_PACKAGE_NAME
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON_B64
        sync: false
      - key: GOOGLE_RTDN_TOKEN
        generateValue: true
