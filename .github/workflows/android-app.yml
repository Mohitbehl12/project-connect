# Android app — released on its own, separately from the iPhone and web apps.
#
# One-time setup (shared with the iPhone workflow): Expo account, secret EXPO_TOKEN, variable EAS_PROJECT_ID.
# For automatic upload to Google Play's internal testing track: a Google service-account key added to the Expo
# project (expo.dev → Credentials → Android → Google Service Account Key). The first upload of a new app must be
# done by hand in the Play Console.
#
# Release: set "android" in mobile/versions.json (e.g. 1.1.0), commit, then push the tag android-v1.1.0.
# That builds the production app and sends it to the internal testing track. Promote it in the Play Console.
# Test builds: Actions → "Android app" → Run workflow (preview gives an installable APK link).
name: Android app

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "preview = installable test APK, production = for Google Play"
        type: choice
        options: [preview, production, development]
        default: preview
      submit:
        description: "Send a production build to Google Play internal testing"
        type: boolean
        default: false
  push:
    tags: ["android-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      KINARA_PLATFORM: android
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Explain missing setup
        if: env.HAS_TOKEN != 'true'
        working-directory: .
        run: echo "::notice::No EXPO_TOKEN secret yet — see the setup steps at the top of .github/workflows/android-app.yml. Nothing was built."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - name: Tag matches the Android version
        if: env.HAS_TOKEN == 'true' && startsWith(github.ref, 'refs/tags/android-v')
        run: |
          WANT="${GITHUB_REF_NAME#android-v}"; HAVE=$(node -p "require('./versions.json').android")
          if [ "$WANT" != "$HAVE" ]; then echo "::error::Tag says $WANT but mobile/versions.json has android $HAVE. Update versions.json first."; exit 1; fi
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: expo/expo-github-action@v8
        if: env.HAS_TOKEN == 'true'
        with: { eas-version: latest, token: "${{ secrets.EXPO_TOKEN }}" }
      - name: Install and check
        if: env.HAS_TOKEN == 'true'
        run: npm ci && npx tsc --noEmit
      - name: Build (and send to Google Play)
        if: env.HAS_TOKEN == 'true'
        run: |
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          SUBMIT=""
          if [ "${{ startsWith(github.ref, 'refs/tags/android-v') }}" = "true" ] || [ "${{ github.event.inputs.submit }}" = "true" ]; then
            if [ "$PROFILE" = "production" ]; then SUBMIT="--auto-submit"; fi
          fi
          eas build --platform android --profile "$PROFILE" --non-interactive --no-wait $SUBMIT
          echo "::notice::Android build started (version $(node -p "require('./versions.json').android")) — follow it on expo.dev."
