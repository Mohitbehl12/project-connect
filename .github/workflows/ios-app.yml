# iPhone app — released on its own, separately from Android and the web app.
#
# One-time setup (shared with the Android workflow):
#   1. Expo account; in mobile/ run `npx eas-cli init` once and note the project id.
#   2. GitHub → Settings → Secrets and variables → Actions: secret EXPO_TOKEN, variable EAS_PROJECT_ID.
#   3. Apple Developer account. The first build needs Apple to create signing certificates: start it once from a
#      computer (`npx eas-cli build -p ios --profile preview`) or set the credentials up on expo.dev.
#   4. For automatic TestFlight upload: an App Store Connect API key added to the Expo project (expo.dev →
#      Credentials → iOS → App Store Connect API Key).
#
# Release: set "ios" in mobile/versions.json (e.g. 1.1.0), commit, then push the tag ios-v1.1.0.
# That builds the production app and sends it to TestFlight. Promote it to the App Store in App Store Connect.
# Test builds: Actions → "iPhone app" → Run workflow.
name: iPhone app

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "preview = installable test app, production = for the App Store"
        type: choice
        options: [preview, production, development]
        default: preview
      submit:
        description: "Send a production build to TestFlight"
        type: boolean
        default: false
  push:
    tags: ["ios-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      KINARA_PLATFORM: ios
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Explain missing setup
        if: env.HAS_TOKEN != 'true'
        working-directory: .
        run: echo "::notice::No EXPO_TOKEN secret yet — see the setup steps at the top of .github/workflows/ios-app.yml. Nothing was built."
      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
      - name: Tag matches the iPhone version
        if: env.HAS_TOKEN == 'true' && startsWith(github.ref, 'refs/tags/ios-v')
        run: |
          WANT="${GITHUB_REF_NAME#ios-v}"; HAVE=$(node -p "require('./versions.json').ios")
          if [ "$WANT" != "$HAVE" ]; then echo "::error::Tag says $WANT but mobile/versions.json has ios $HAVE. Update versions.json first."; exit 1; fi
      - uses: actions/setup-node@v7
        if: env.HAS_TOKEN == 'true'
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: expo/expo-github-action@v9
        if: env.HAS_TOKEN == 'true'
        with: { eas-version: latest, token: "${{ secrets.EXPO_TOKEN }}" }
      - name: Install and check
        if: env.HAS_TOKEN == 'true'
        run: npm ci && npx tsc --noEmit
      - name: Build (and send to TestFlight)
        if: env.HAS_TOKEN == 'true'
        run: |
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          SUBMIT=""
          if [ "${{ startsWith(github.ref, 'refs/tags/ios-v') }}" = "true" ] || [ "${{ github.event.inputs.submit }}" = "true" ]; then
            if [ "$PROFILE" = "production" ]; then SUBMIT="--auto-submit"; fi
          fi
          eas build --platform ios --profile "$PROFILE" --non-interactive --no-wait $SUBMIT
          echo "::notice::iPhone build started (version $(node -p "require('./versions.json').ios")) — follow it on expo.dev."
